<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lead generation calculators — embed example</title>
    <link rel="stylesheet" href="ASSET_ORIGIN/assets/v1/app.css">
    <link rel="stylesheet" href="ASSET_ORIGIN/assets/v1/fonts.css">
    <script>
      window.RAAD_TIL_BOLIG = window.RAAD_TIL_BOLIG || {};
      window.RAAD_TIL_BOLIG.config = {
        brandName: "YOUR_COMPANY_NAME",
        privacyUrl: "https://www.example.com/privacy"
      };
    </script>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; }
      main { max-width: 1400px; margin: auto; padding: 24px; }
      section { margin-block: 48px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Lead generation calculators</h1>

      <section aria-labelledby="loan-check-heading">
        <h2 id="loan-check-heading">Loan Check</h2>
        <div class="YOUR_THEME_CLASS">
          <rtb-loan-check advisorname="YOUR_ADVISER_NAME"></rtb-loan-check>
        </div>
      </section>

      <section aria-labelledby="home-equity-heading">
        <h2 id="home-equity-heading">Home Equity</h2>
        <div class="YOUR_THEME_CLASS">
          <rtb-home-equity advisorname="YOUR_ADVISER_NAME"></rtb-home-equity>
        </div>
      </section>
    </main>
    <script type="module"
      src="ASSET_ORIGIN/static/v1/components/components.esm.js"></script>
    <script type="module"
      src="ASSET_ORIGIN/static/v1/assets/ionicons/ionicons.esm.js"></script>
  </body>
</html>
